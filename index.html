<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Real Madrid Vays7 Edition</title>
    
    <!-- НАСТРОЙКИ PWA ДЛЯ IPHONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Real Madrid">
    <link rel="apple-touch-icon" href="https://wikimedia.org">

    <!-- Место для стилей из Блока 2 -->
</head>
<body>
    <div class="space"><div class="stars-3"></div></div>
    <div class="comet-1"></div><div class="comet-2"></div>
    <div class="card" id="card">
        <div class="ball-lines"></div><div class="audio-btn" id="audio-icon">🔇</div>
        <div class="card-inner">
            <div class="title">Real Madrid CF</div>
            <div class="box">
                <div class="m-title" id="m-title">Синхронизация...</div>
                <div class="m-time" id="m-time">Загрузка сети</div>
                <div class="timer" id="timer">...</div>
            </div>
            <div class="time-row">
                <div class="date" id="w-date">-- --</div><div class="clock" id="w-clock">00:00:00</div>
            </div>
            <div class="slogan">Hala Madrid</div><div class="tag">Vays7 Edition</div>
        </div>
    </div>
    <div class="ball-shadow"></div>
    <!-- Место для скрипта из Блока 3 -->
</body>
</html>
<style>
    body { 
        margin:0; padding:0; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; 
        font-family:'Segoe UI',sans-serif; user-select:none; overflow:hidden; position:relative;
        background:radial-gradient(circle at center, #1B396A, #0F254A, #061024); 
    }
    .space, .space::before, .space::after, .stars-3 { content:''; position:absolute; inset:0; pointer-events:none; z-index:1; }
    .space::before {
        background-image: 
            radial-gradient(circle at 8% 12%, #fff 1.5px, transparent 1.5px), radial-gradient(circle at 25% 35%, #fff 1.2px, transparent 1.2px),
            radial-gradient(circle at 75% 20%, #fff 2px, transparent 2px), radial-gradient(circle at 45% 85%, #febe10 1.2px, transparent 1.2px),
            radial-gradient(circle at 92% 65%, #fff 1.5px, transparent 1.5px), radial-gradient(circle at 60% 45%, #fff 1px, transparent 1px),
            radial-gradient(circle at 3% 88%, #fff 1.3px, transparent 1.3px), radial-gradient(circle at 88% 10%, #febe10 1px, transparent 1px),
            radial-gradient(circle at 50% 20%, #fff 1.6px, transparent 1.6px);
        animation: blinkFast 3s ease-in-out infinite alternate;
    }
    .space::after {
        background-image: 
            radial-gradient(circle at 15% 70%, #fff 1.2px, transparent 1.2px), radial-gradient(circle at 38% 15%, #febe10 1.5px, transparent 1.5px),
            radial-gradient(circle at 85% 45%, #fff 1.3px, transparent 1.3px), radial-gradient(circle at 68% 75%, #fff 1px, transparent 1px),
            radial-gradient(circle at 50% 55%, #febe10 1.2px, transparent 1.2px), radial-gradient(circle at 30% 90%, #fff 1.6px, transparent 1.6px),
            radial-gradient(circle at 78% 92%, #fff 1.4px, transparent 1.4px), radial-gradient(circle at 18% 30%, #fff 1.2px, transparent 1.2px);
        animation: blinkMedium 4.5s ease-in-out infinite alternate-reverse;
    }
    .stars-3 {
        background-image: 
            radial-gradient(circle at 5% 45%, rgba(255,255,255,0.6) 1.2px, transparent 1.2px), radial-gradient(circle at 22% 80%, rgba(254,190,16,0.5) 1px, transparent 1px),
            radial-gradient(circle at 55% 10%, rgba(255,255,255,0.7) 1.5px, transparent 1.5px), radial-gradient(circle at 80% 88%, rgba(254,190,16,0.6) 1.3px, transparent 1.3px),
            radial-gradient(circle at 95% 25%, rgba(255,255,255,0.5) 1.1px, transparent 1.1px), radial-gradient(circle at 70% 30%, rgba(255,255,255,0.7) 1.4px, transparent 1.4px),
            radial-gradient(circle at 40% 65%, rgba(255,255,255,0.5) 1.3px, transparent 1.3px), radial-gradient(circle at 65% 95%, rgba(254,190,16,0.4) 1.6px, transparent 1.6px);
        animation: blinkSlow 6s ease-in-out infinite alternate;
    }
    @keyframes blinkFast { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }
    @keyframes blinkMedium { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.8; } }
    @keyframes blinkSlow { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.6; } }

    .comet-1, .comet-2 { position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 2; pointer-events: none; opacity: 0; }
    .comet-1 { top: -50px; left: 105%; background: linear-gradient(to right, #fff, #febe10, transparent); box-shadow: 0 0 15px 2px #fff, -15px 0 25px 4px rgba(254,190,16,0.5); transform: rotate(-35deg); animation: shoot1 14s linear infinite; }
    .comet-2 { bottom: -50px; left: -50px; background: linear-gradient(to left, #fff, #febe10, transparent); box-shadow: 0 0 15px 2px #fff, 15px 0 25px 4px rgba(254,190,16,0.5); transform: rotate(35deg); animation: shoot2 18s linear infinite; animation-delay: 4s; }
    @keyframes shoot1 { 0% { transform: translate(0, 0) rotate(-35deg) scale(0); opacity: 0; } 6% { opacity: 1; transform: translate(-400px, 280px) rotate(-35deg) scale(1); } 12%, 100% { opacity: 0; transform: translate(-700px, 490px) rotate(-35deg) scale(0); } }
    @keyframes shoot2 { 0% { transform: translate(0, 0) rotate(35deg) scale(0); opacity: 0; } 6% { opacity: 1; transform: translate(450px, -315px) rotate(35deg) scale(1); } 12%, 100% { opacity: 0; transform: translate(750px, -525px) rotate(35deg) scale(0); } }

    .card { 
        position:relative; z-index:10; width:340px; height:340px; border-radius:50%; background: rgba(255, 255, 255, 0.05); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); 
        box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 0 35px rgba(255,255,255,0.05); display:flex; justify-content:center; align-items:center; box-sizing:border-box; padding: 32px;
        transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s;
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 35px 70px rgba(0,0,0,0.6), 0 0 45px rgba(254,190,16,0.4); }
    .card::before {
        content:''; position:absolute; inset:0; border-radius:50%; padding:2.2px; pointer-events:none; z-index: 3;
        background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05), rgba(255,255,255,0.25));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; background-size: 300% 300%; animation: borderFlow 6s linear infinite;
    }
    .ball-lines { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0.08; z-index: 2; background: radial-gradient(circle at 50% 50%, transparent 62%, #fff 63%, transparent 64%), radial-gradient(circle at 0% 0%, transparent 72%, #fff 73%, transparent 74%), radial-gradient(circle at 100% 100%, transparent 72%, #fff 73%, transparent 74%); }
    .card:hover::before, .card.alert::before { background: linear-gradient(135deg, #febe10, #fff, #febe10, rgba(255,255,255,0.1)); background-size:300% 300%; }
    .card.alert { animation: alertPulse 1.2s infinite alternate; }
    @keyframes borderFlow { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
    @keyframes alertPulse { 0% { box-shadow:0 0 15px rgba(254,190,16,0.3); } 100% { box-shadow:0 0 45px rgba(254,190,16,0.8); } }

    .ball-shadow { width: 200px; height: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%); border-radius: 50%; margin-top: 25px; z-index: 5; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s; }
    .card:hover ~ .ball-shadow { transform: scale(0.8); opacity: 0.35; }
    .card-inner { z-index: 5; width: 100%; text-align: center; }
    .audio-btn { position:absolute; top:28px; left:50%; transform:translateX(-50%); font-size:1rem; opacity:0.5; transition:opacity 0.2s; cursor:pointer; z-index: 6; }
    .card:hover .audio-btn { opacity:0.9; }
    
    .title { font-size:1.35rem; color:#fff; text-transform:uppercase; letter-spacing:4px; font-weight:700; margin: 25px 0 10px; text-shadow:0 2px 5px rgba(0,0,0,0.4); }
    .box { margin:8px 0 12px; padding:12px 8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:18px; }
    .alert .box { background:rgba(254,190,16,0.12); border-color: rgba(254,190,16,0.3); }
    .m-title { font-size:0.72rem; color:#fff; text-transform:uppercase; font-weight:700; margin-bottom:5px; line-height:1.4; letter-spacing: 0.3px; padding: 0 4px; word-wrap: break-word; }
    .m-time { font-size:0.75rem; color:#febe10; text-transform:uppercase; font-weight:700; margin-bottom:5px; }
    .timer { font-size:0.88rem; color:#fff; font-weight:600; }
    .alert .timer { color:#febe10; text-shadow:0 0 5px rgba(254,190,16,0.4); }
    
    .time-row { display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); }
    .clock { font-size:0.95rem; font-weight:600; color:#fff; opacity:0.95; letter-spacing:0.5px; font-variant-numeric:tabular-nums; text-shadow: 0 0 8px rgba(254, 190, 16, 0.6); }
    .date { font-size:0.78rem; color:rgba(255,255,255,0.6); text-transform:uppercase; }
    .slogan { font-size:0.8rem; color:rgba(255,255,255,0.5); letter-spacing:6px; text-transform:uppercase; margin-top:12px; font-weight:700; }
    .tag { font-size:0.68rem; color:#febe10; letter-spacing:1px; text-transform:uppercase; font-weight:700; margin-top:3px; }
</style>
<link rel="apple-touch-icon" href="https://wikimedia.org">
