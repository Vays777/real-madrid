<script>
    let nextMatch = null, audioCtx = null, isAudioAllowed = false, soundPlayed = false, notified = false;
    const months = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
    const days = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];

    if (Notification.permission === "default") Notification.requestPermission();

    document.getElementById('card').addEventListener('click', (e) => {
        if (e.target.id === 'audio-icon' || e.target.classList.contains('audio-btn')) return;
        initAudio();
    });
    document.getElementById('audio-icon').addEventListener('click', (e) => { e.stopPropagation(); initAudio(); });

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isAudioAllowed = !isAudioAllowed;
        document.getElementById('audio-icon').textContent = isAudioAllowed ? "🔊" : "🔇";
    }

    function playDoubleChord() {
        if (!audioCtx) return;
        [0, 0.5].forEach(d => {
            let t = audioCtx.currentTime + d;
            [261.63, 329.63, 392.00].forEach((f, i) => {
                let osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t + i * 0.08);
                g.gain.setValueAtTime(0.15, t + i * 0.08); g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.4);
                osc.connect(g); g.connect(audioCtx.destination); 
                osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.4);
                osc.onended = () => { osc.disconnect(); g.disconnect(); };
            });
        });
    }

    async function fetchCalendar() {
        try {
            const targetUrl = encodeURIComponent('https://footballcal.com');
            const res = await fetch(`https://allorigins.win{targetUrl}`);
            if (!res.ok) throw new Error('Сбой сети');
            const data = await res.json();
            if (!data || !data.contents) throw new Error('Пустой ответ прокси');
            
            const cleanContents = data.contents.replace(/http:\/\//g, 'https://');
            const events = cleanContents.split('BEGIN:VEVENT');
            const now = Date.now(); 
            let list = [];
            
            events.forEach(ev => {
                const sumMatch = ev.match(/SUMMARY:(.+)/);
                const startMatch = ev.match(/DTSTART:(.+)/);
                
                if (sumMatch && startMatch) {
                    // ИСПРАВЛЕНО: Безопасное извлечение чистой строки из регулярного выражения
                    let titleStr = sumMatch[1].replace(/\r|\n/g, '').trim();
                    let dateStr = startMatch[1].replace(/\r|\n/g, '').trim();
                    
                    let matchTime = Date.UTC(
                        dateStr.substring(0,4), 
                        dateStr.substring(4,6)-1, 
                        dateStr.substring(6,8), 
                        dateStr.substring(9,11), 
                        dateStr.substring(11,13)
                    );
                    
                    if (matchTime + 7200000 > now) {
                        list.push({ 
                            title: titleStr.replace("Real Madrid", "Реал Мадрид"), 
                            time: matchTime, 
                            display: new Date(matchTime).toLocaleString('ru-RU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + " МСК" 
                        });
                    }
                }
            });
            
            list.sort((a,b) => a.time - b.time); 
            if (list.length) {
                nextMatch = list[0];
            }
        } catch (e) {
            console.error("Ошибка парсинга:", e);
        }
        
        if (!nextMatch) {
            nextMatch = { 
                title: "Ла Лига: Реал Мадрид — Вильярреал", 
                time: 1791658800000, 
                display: "10 Окт, 22:00 МСК" 
            };
        }
    }

    function tick() {
        try {
            const now = new Date();
            document.getElementById('w-clock').textContent = now.toLocaleTimeString('ru-RU');
            document.getElementById('w-date').textContent = `${now.getDate()} ${months[now.getMonth()]}., ${days[now.getDay()]}`;

            const timerEl = document.getElementById('timer'), cardEl = document.getElementById('card');
            
            if (!nextMatch) {
                document.getElementById('m-title').textContent = "Синхронизация...";
                document.getElementById('m-time').textContent = "Загрузка сети";
                timerEl.textContent = "...";
                return;
            }
            
            document.getElementById('m-title').textContent = nextMatch.title;
            document.getElementById('m-time').textContent = nextMatch.display;

            const timeDiff = nextMatch.time - now.getTime();
            if (timeDiff <= 0) {
                if (timeDiff > -7200000) {
                    timerEl.textContent = "МАТЧ ИДЕТ ПРЯМО СЕЙЧАС!";
                } else {
                    nextMatch = null;
                    fetchCalendar();
                }
                cardEl.classList.remove('alert');
                soundPlayed = notified = false;
            } else {
                const d = Math.floor(timeDiff / 86400000), h = Math.floor((timeDiff % 86400000) / 3600000), m = Math.floor((timeDiff % 3600000) / 60000);
                timerEl.textContent = d > 0 ? `ЧЕРЕЗ: ${d}д. ${h}ч.` : `ЧЕРЕЗ: ${h}ч. ${m}мин.`;
                
                if (d === 0 && h === 0 && timeDiff <= 600000) {
                    cardEl.classList.add('alert'); timerEl.textContent = `🔔 МАТЧ СКОРО! (${m} мин)`;
                    if (!notified && Notification.permission === "granted") {
                        new Notification("Real Madrid CF", { body: `До матча осталось 10 минут!\n${nextMatch.title}` });
                        notified = true;
                    }
                    if (!soundPlayed && isAudioAllowed) { playDoubleChord(); soundPlayed = true; }
                } else { cardEl.classList.remove('alert'); }
            }
        } catch(e){
            console.error("Ошибка таймера:", e);
        }
    }

    fetchCalendar().then(() => { setInterval(tick, 1000); tick(); });
</script>
